name: Build city profiles (all cities)

# Phase 1: one job per state pulls road features out of that state's OpenStreetMap
# extract (Geofabrik). Phase 2 combines them nationally and computes every city's
# profile (roads, NOAA climate normals, daylight), then commits city-profiles.json.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: rebuild only these state codes or city slugs (space-separated); blank = all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        state: ["alabama", "alaska", "arizona", "arkansas", "california", "colorado", "connecticut", "delaware", "florida", "georgia", "hawaii", "idaho", "illinois", "indiana", "iowa", "kansas", "kentucky", "louisiana", "maine", "maryland", "massachusetts", "michigan", "minnesota", "mississippi", "missouri", "montana", "nebraska", "nevada", "new-hampshire", "new-jersey", "new-mexico", "new-york", "north-carolina", "north-dakota", "ohio", "oklahoma", "oregon", "pennsylvania", "rhode-island", "south-carolina", "south-dakota", "tennessee", "texas", "utah", "vermont", "virginia", "washington", "west-virginia", "wisconsin", "wyoming", "district-of-columbia"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq osmium-tool && pip install osmium
      - name: Download and filter
        run: |
          curl -sSfL --retry 5 --retry-delay 20 -o state.osm.pbf "https://download.geofabrik.de/north-america/us/${{ matrix.state }}-latest.osm.pbf"
          osmium tags-filter state.osm.pbf n/highway=traffic_signals n/railway=level_crossing w/junction=roundabout w/highway=motorway,trunk w/surface=gravel,unpaved,dirt,compacted,fine_gravel n/place=city,town,village,hamlet,suburb -o small.osm.pbf --overwrite
          rm state.osm.pbf
      - run: python scripts/osm_features.py small.osm.pbf features-${{ matrix.state }}.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: features-${{ matrix.state }}
          path: features-${{ matrix.state }}.json.gz
          retention-days: 7

  profiles:
    needs: features
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests astral timezonefinder numpy scipy
      - uses: actions/download-artifact@v4
        with:
          path: features
          pattern: features-*
      - uses: actions/cache@v4
        with:
          path: .cache
          key: normals-${{ github.run_id }}
          restore-keys: normals-
      - run: python scripts/city_profiles_full.py features ${{ github.event.inputs.only }}
      - uses: actions/upload-artifact@v4
        with:
          name: city-profiles
          path: src/data/guide/city-profiles.json
          retention-days: 14
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short | head -20
          cp src/data/guide/city-profiles.json /tmp/city-profiles.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/city-profiles.json src/data/guide/city-profiles.json
            git add src/data/guide/city-profiles.json
            git diff --cached --quiet && { echo "no changes"; exit 0; }
            git commit -q -m "City profiles for all city guides" && git push origin HEAD:main && exit 0
            echo "push failed, retrying"; sleep 15
          done
          exit 1
