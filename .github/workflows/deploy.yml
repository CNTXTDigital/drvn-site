name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub sign in to AWS without stored keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BUCKET: drvnapp-site-prod-945841675274
  DISTRIBUTION_ID: EGWSSDYSP4T5A
  ROLE_ARN: arn:aws:iam::945841675274:role/drvn-site-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload assets (long cache)
        run: aws s3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public,max-age=31536000,immutable"
      - name: Upload pages (short cache)
        run: aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" --exclude "wp-content/*" --cache-control "public,max-age=300"
      - name: Refresh CDN
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
