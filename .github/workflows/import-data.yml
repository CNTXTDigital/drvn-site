name: Import guide data

# One-time import of the state, city and listing data recovered from the old
# WordPress database (stored privately in the migration bucket). Commits the
# JSON into src/data/guide/ so the site builds from versioned files.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-data.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945841675274:role/drvn-site-github-deploy
          aws-region: us-east-2
      - run: |
          mkdir -p src/data/guide
          for f in states cities listings; do
            aws s3 cp "s3://drvnapp-migration-945841675274/data/$f.json" "src/data/guide/$f.json"
          done
          ls -la src/data/guide
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/guide
          git diff --cached --quiet || git commit -m "Import guide data (states, cities, listings) from WordPress snapshot"
          git push
